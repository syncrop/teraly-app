<div class="sticky top-0 bg-white border-b border-gray-200 md:relative md:z-auto" style="z-index: 9999; padding: 0 1.5rem 0.5rem; pointer-events: auto; touch-action: manipulation; -webkit-user-select: none; user-select: none;">
  <div class="flex justify-between items-center">
    <div>
      @if (subtitle) {
        <p class="text-sm text-gray-500 mb-1">{{ subtitle }}</p>
      }
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">
        @if (title) {
          <span>{{ title }}</span>
        }
        @if (userName) {
          {{ userName }} 👋
        }
      </h1>
    </div>
    @if (showNotifications) {
      <button class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors" style="touch-action: manipulation; pointer-events: auto;">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        @if (notificationCount > 0) {
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        }
      </button>
    }
  </div>
</div>
