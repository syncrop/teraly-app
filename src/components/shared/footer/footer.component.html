<nav
  class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-3 sm:px-6"
>
  <div class="flex justify-around items-center max-w-md mx-auto">
    <!-- Home -->
    <a
      routerLink="/app"
      class="flex flex-col items-center gap-2 px-4 py-2 rounded-lg transition-colors"
      [class.text-indigo-600]="isActive('/app')"
      [class.text-gray-400]="!isActive('/app')"
    >
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
      <span class="text-xs font-medium" i18n="@@navigation.home">Inicio</span>
    </a>

    <!-- Search -->
    <a
      routerLink="/app/search"
      class="flex flex-col items-center gap-2 px-4 py-2 rounded-lg transition-colors"
      [class.text-indigo-600]="isActive('/search')"
      [class.text-gray-400]="!isActive('/search')"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <span class="text-xs font-medium" i18n="@@navigation.search">Buscar</span>
    </a>

    <!-- Create/Action Button -->
    <button
      class="w-12 h-12 rounded-full bg-indigo-600 text-white shadow-lg flex items-center justify-center hover:bg-indigo-700 transition-colors"
      aria-label="Crear"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </button>

    <!-- Calendar/Appointments -->
    <a
      routerLink="/app/appointments"
      class="flex flex-col items-center gap-2 px-4 py-2 rounded-lg transition-colors"
      [class.text-indigo-600]="isActive('/appointments')"
      [class.text-gray-400]="!isActive('/appointments')"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <span class="text-xs font-medium" i18n="@@navigation.appointments">Citas</span>
    </a>

    <!-- Profile -->
    <a
      routerLink="/app/profile"
      class="flex flex-col items-center gap-2 px-4 py-2 rounded-lg transition-colors"
      [class.text-indigo-600]="isActive('/profile')"
      [class.text-gray-400]="!isActive('/profile')"
    >
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
        />
      </svg>
      <span class="text-xs font-medium" i18n="@@navigation.profile">Perfil</span>
    </a>
  </div>
</nav>
