<!-- 
  FOOTER "INSTAGRAM STYLE" - Teraly
  Compacto, sin espacios muertos enormes y respetando el Safe Area de forma elegante.
-->

<nav 
  class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 compact-footer select-none"
  style="touch-action: manipulation;"
>
  
  <!-- 
    CONTENEDOR PRINCIPAL
    Altura fija de 'h-11' (44px) para mantenerlo delgado.
    Los elementos se centran verticalmente en esta franja.
  -->
  <div class="h-11 flex justify-around items-center max-w-md mx-auto px-1 w-full">

    @if (isDoctor) {
      <!-- ================= DOCTOR ================= -->

      <!-- Panel -->
      <a
        (click)="navigateToHome($event)"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 cursor-pointer transition-colors"
        [class.text-indigo-600]="isActive('/app')"
        [class.text-gray-400]="!isActive('/app')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Panel</span>
      </a>

      <!-- Pacientes -->
      <a
        routerLink="/app/patients"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/patients')"
        [class.text-gray-400]="!isActive('/patients')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Pacientes</span>
      </a>

      <!-- Agenda -->
      <a
        routerLink="/app/calendar"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/calendar')"
        [class.text-gray-400]="!isActive('/calendar')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Agenda</span>
      </a>

      <!-- Chats -->
      <a
        routerLink="/app/chats"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/chats')"
        [class.text-gray-400]="!isActive('/chats')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-4l-4 4v-4z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Chats</span>
      </a>

      <!-- Perfil -->
      <a
        routerLink="/app/profile"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/profile')"
        [class.text-gray-400]="!isActive('/profile')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Perfil</span>
      </a>

    } @else {
      <!-- ================= PACIENTE ================= -->

      <!-- Inicio -->
      <a
        (click)="navigateToHome($event)"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 cursor-pointer transition-colors"
        [class.text-indigo-600]="isActive('/app')"
        [class.text-gray-400]="!isActive('/app')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Inicio</span>
      </a>

      <!-- Buscar -->
      <a
        routerLink="/app/search"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/search')"
        [class.text-gray-400]="!isActive('/search')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Buscar</span>
      </a>

      <!-- Citas -->
      <a
        routerLink="/app/appointments"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/appointments')"
        [class.text-gray-400]="!isActive('/appointments')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Citas</span>
      </a>

      <!-- Chats -->
      <a
        routerLink="/app/chats"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/chats')"
        [class.text-gray-400]="!isActive('/chats')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-4l-4 4v-4z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Chats</span>
      </a>

      <!-- Perfil -->
      <a
        routerLink="/app/profile"
        class="flex flex-1 min-w-0 flex-col items-center justify-center h-full px-1 transition-colors"
        [class.text-indigo-600]="isActive('/profile')"
        [class.text-gray-400]="!isActive('/profile')"
      >
        <svg class="w-6 h-6 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
        </svg>
        <span class="text-[10px] font-medium leading-none truncate">Perfil</span>
      </a>
    }
  </div>

</nav>

<!-- ESTILOS (Pon esto en tu CSS global o del componente) -->
<style>
  .compact-footer {
    /* TRUCO PRO:
      Restamos 8px a la zona segura para "chupar" hacia abajo la barra blanca.
      Esto elimina el exceso de espacio en blanco en iPhones modernos.
    */
    padding-bottom: calc(env(safe-area-inset-bottom));
    
    /* Fallback para móviles viejos: asegúrate de tener al menos 10px abajo */
    padding-bottom: max(10px, calc(env(safe-area-inset-bottom) - 8px));
  }
</style>
