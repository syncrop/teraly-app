
<div class="flex flex-col items-center min-h-screen bg-white p-6">
  <div class="w-full max-w-sm">

    <div class="grid grid-cols-3 items-center mb-8">
      <div class="justify-self-start">
        <a routerLink="/login" class="text-gray-500 hover:text-indigo-600 p-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
      </div>
      <div class="justify-self-center">
        <app-logo></app-logo>
      </div>
      <div></div>
    </div>

    <div class="text-center mb-8">
      <h1 i18n class="text-3xl font-bold text-gray-900">Registration</h1>
    </div>

    <!-- User Type Toggle Switch -->
    <div class="flex justify-center items-center space-x-4 mb-8">
        <span 
            [class.text-indigo-600]="userType() === 'patient'" 
            [class.font-semibold]="userType() === 'patient'"
            [class.text-gray-400]="userType() !== 'patient'"
            class="transition-colors duration-300">
            <span i18n>Patient</span>
        </span>
        
        <button 
            (click)="toggleUserType()" 
            type="button" 
            role="switch"
            [attr.aria-checked]="userType() === 'patient'"
            class="relative inline-flex items-center h-8 w-14 rounded-full transition-colors duration-300 focus:outline-none"
            [class.bg-indigo-600]="userType() === 'patient'"
            [class.bg-gray-200]="userType() === 'specialist'">
            <span
                class="inline-block w-6 h-6 transform bg-white rounded-full transition-transform duration-300 ease-in-out"
                [class.translate-x-1]="userType() === 'patient'"
                [class.translate-x-7]="userType() === 'specialist'">
            </span>
        </button>

        <span 
            [class.text-indigo-600]="userType() === 'specialist'" 
            [class.font-semibold]="userType() === 'specialist'"
            [class.text-gray-400]="userType() !== 'specialist'"
            class="transition-colors duration-300">
            <span i18n>Specialist</span>
        </span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-4">
      <div class="space-y-4">
        <div>
          <label for="fullName" class="sr-only" i18n>Full Name</label>
          <input formControlName="fullName" id="fullName" name="fullName" type="text" autocomplete="name" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                 i18n-placeholder placeholder="Full Name">
        </div>
        <div>
          <label for="email-register" class="sr-only" i18n>Email</label>
          <input formControlName="email" id="email-register" name="email" type="email" autocomplete="email" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                 i18n-placeholder placeholder="Email">
        </div>
        <div>
          <label for="password-register" class="sr-only" i18n>Password</label>
          <input formControlName="password" id="password-register" name="password" type="password" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                 i18n-placeholder placeholder="Password">
        </div>
        <div>
          <label for="confirmPassword" class="sr-only" i18n>Confirm Password</label>
          <input formControlName="confirmPassword" id="confirmPassword" name="confirmPassword" type="password" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                 i18n-placeholder placeholder="Confirm Password">
          @if (registerForm.get('confirmPassword')?.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched) {
            <p i18n class="text-red-500 text-xs mt-1">Passwords do not match.</p>
          }
        </div>
        
        @if (userType() === 'specialist') {
          <div class="pt-2">
            <label for="licenseNumber" class="sr-only" i18n>License / Diploma Number</label>
            <input formControlName="licenseNumber" id="licenseNumber" name="licenseNumber" type="text" required
                   class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                   i18n-placeholder placeholder="License / Diploma Number">
          </div>
        }
      </div>

      <div class="pt-4">
        <button type="submit" [disabled]="!isSubmittable()"
                class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-300 disabled:cursor-not-allowed">
          <span i18n>Register</span>
        </button>
      </div>
    </form>
    
    <p class="mt-8 text-center text-sm text-gray-600">
      <span i18n>Already have an account?</span>
      <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500">
        <span i18n>Login</span>
      </a>
    </p>

  </div>
</div>
