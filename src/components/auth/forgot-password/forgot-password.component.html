
<div class="flex flex-col items-center min-h-screen bg-white p-6">
  <div class="w-full max-w-sm">

    <div class="grid grid-cols-3 items-center mb-8">
      <div class="justify-self-start">
        <a routerLink="/login" class="text-gray-500 hover:text-indigo-600 p-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
      </div>
      <div class="justify-self-center">
        <app-logo></app-logo>
      </div>
      <div></div>
    </div>

    @if (!submitted()) {
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900" i18n="@@forgotPassword.title">Forgot Password</h1>
        <p class="mt-2 text-gray-500" i18n="@@forgotPassword.subtitle">
          Enter the email associated with your account and we'll send a reset link.
        </p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()" class="space-y-6">
        <div>
          <label for="email-forgot" class="sr-only" i18n="@@forgotPassword.emailLabel">Email</label>
          <input formControlName="email" id="email-forgot" name="email" type="email" autocomplete="email" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-200 bg-gray-50 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white sm:text-sm"
                 placeholder="Email" i18n-placeholder="@@forgotPassword.emailPlaceholder">
        </div>

        <div class="pt-2">
          <button type="submit" [disabled]="!isSubmittable()"
                  class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-300 disabled:cursor-not-allowed">
            <span i18n="@@forgotPassword.sendButton">Send Reset Link</span>
          </button>
        </div>
      </form>
    } @else {
      <div class="text-center space-y-6 py-10">
         <div class="flex justify-center">
          <svg class="h-16 w-16 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900" i18n="@@forgotPassword.successTitle">Check your email</h1>
        <p class="text-gray-600" i18n="@@forgotPassword.successMessage">
           If an account exists for {forgotPasswordForm.value.email}, you will receive a password reset link.
        </p>
        <div class="pt-4">
          <a routerLink="/login"
             class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            <span i18n="@@forgotPassword.backToLogin">Back to Login</span>
          </a>
        </div>
      </div>
    }

  </div>
</div>
