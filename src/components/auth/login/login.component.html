<app-auth-layout>
  <div class="w-full space-y-10">
    
    <div class="text-center md:text-left">
      <div class="md:hidden inline-block mb-8">
        <app-logo></app-logo>
      </div>
      <h1 class="text-3xl font-bold text-gray-900" i18n="@@login.welcome">Welcome</h1>
      <p class="mt-2 text-lg text-gray-500" i18n="@@login.subtitle">Your trusted Psychology platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1" i18n="@@login.emailLabel">Email</label>
          <input formControlName="email" id="email" name="email" type="email" autocomplete="email" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-200 bg-gray-50 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white sm:text-sm"
                 placeholder="client@teraly.com" i18n-placeholder="@@login.emailPlaceholder">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1" i18n="@@login.passwordLabel">Password</label>
          <input formControlName="password" id="password" name="password" type="password" autocomplete="current-password" required
                 class="appearance-none rounded-xl relative block w-full px-4 py-3.5 border border-gray-200 bg-gray-50 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white sm:text-sm"
                 placeholder="pass" i18n-placeholder="@@login.passwordPlaceholder">
        </div>
      </div>
      
      @if (errorMessage()) {
        <p class="text-red-500 text-sm text-center bg-red-50 p-3 rounded-lg">{{ errorMessage() }}</p>
      }
      
      @if (loginForm.hasError('invalidCredentials') && !loginForm.pristine) {
        <p class="text-red-500 text-sm text-center" i18n="@@login.invalidCredentials">Invalid credentials. Please try again.</p>
      }

       <div class="flex items-center justify-end">
          <div class="text-sm">
            <a routerLink="/forgot-password" class="font-medium text-indigo-600 hover:text-indigo-500">
              <span i18n="@@login.forgotPassword">Forgot your password?</span>
            </a>
          </div>
        </div>

      <div class="pt-2">
        <button type="submit" [disabled]="!isSubmittable()"
                class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-300 disabled:cursor-not-allowed">
          <span i18n="@@login.loginButton">Login</span>
        </button>
      </div>
    </form>
    
    <p class="text-center text-sm text-gray-600">
      <span i18n="@@login.noAccount">Don't have an account?</span>
      <a routerLink="/register" class="font-medium text-indigo-600 hover:text-indigo-500">
        <span i18n="@@login.registerLink">Register</span>
      </a>
    </p>

  </div>
</app-auth-layout>
