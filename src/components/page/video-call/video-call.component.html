<div class="video-call-container">
  <div *ngIf="isLoading()" class="loading">
    <p>Conectando...</p>
  </div>

  <div *ngIf="!isLoading() && appointment()" class="video-call-content">
    <!-- Video principal -->
    <div class="main-video">
      <div class="video-placeholder">
        <div class="participant-info">
          <h2>{{ appointment()?.doctorName || 'Participante' }}</h2>
        </div>
        <!-- Video remoto -->
        <div class="video-feed">
          <video #remoteVideo autoplay playsinline class="remote-video"></video>
          <span class="video-status" *ngIf="!isVideoOn()">Cámara desactivada</span>
        </div>
      </div>

      <!-- Video propio (PiP) -->
      <div class="self-video">
        <div class="video-feed-small">
          <video #localVideo autoplay playsinline muted class="local-video"></video>
          <span class="video-status" *ngIf="!isVideoOn()">Tu cámara</span>
        </div>
      </div>
    </div>

    <!-- Información de la llamada -->
    <div class="call-info">
      <div class="call-header">
        <div class="appointment-details">
          <h3>Sesión con Dr. {{ appointment()?.doctorName }}</h3>
          <p>{{ appointment()?.type }}</p>
        </div>
        <div class="call-timer">
          <span>{{ callDuration() }}</span>
        </div>
      </div>
    </div>

    <!-- Controles de la llamada -->
    <div class="call-controls">
      <button 
        class="control-btn" 
        [class.active]="isMicOn()"
        (click)="toggleMic()"
        title="Micrófono">
        <svg *ngIf="isMicOn()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <svg *ngIf="!isMicOn()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button 
        class="control-btn" 
        [class.active]="isVideoOn()"
        (click)="toggleVideo()"
        title="Cámara">
        <svg *ngIf="isVideoOn()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <svg *ngIf="!isVideoOn()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path>
        </svg>
      </button>

      <button 
        class="control-btn" 
        [class.active]="isScreenSharing()"
        (click)="toggleScreenShare()"
        title="Compartir pantalla">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>

      <button 
        class="control-btn end-call" 
        (click)="endCall()"
        title="Finalizar llamada">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 16.92V20a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 5.11 2h3.09a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 10.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 23 16.92z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
