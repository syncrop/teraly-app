<!-- Desktop Header -->
<header class="hidden md:flex fixed top-0 left-0 right-0 bg-white border-b border-gray-200 h-20 px-6 justify-between items-center z-10">
  <app-logo></app-logo>
  <div class="flex items-center space-x-8">
    <a [routerLink]="userRole() === 'client' ? '/app/home-client' : '/app/home-doctor'"
       routerLinkActive="text-indigo-600 font-semibold"
       [routerLinkActiveOptions]="{exact: true}"
       class="text-gray-600 hover:text-indigo-600 transition-colors">
      <span i18n="@@navigation.home">Home</span>
    </a>
    <a routerLink="/app/search"
       routerLinkActive="text-indigo-600 font-semibold"
       class="text-gray-600 hover:text-indigo-600 transition-colors">
      <span i18n="@@navigation.search">Search</span>
    </a>
    <a routerLink="/app/profile"
       routerLinkActive="text-indigo-600 font-semibold"
       class="text-gray-600 hover:text-indigo-600 transition-colors">
      <span i18n="@@navigation.profile">Profile</span>
    </a>
  </div>
  <button (click)="logout()" class="text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg shadow-sm">
    <span i18n="@@navigation.logout">Logout</span>
  </button>
</header>

<!-- Main Content -->
<main class="md:pt-20 pb-24">
  <router-outlet></router-outlet>
</main>

<!-- Mobile Footer -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
  <div class="flex justify-around max-w-lg mx-auto">
    
    <!-- Home Link -->
    <a [routerLink]="userRole() === 'client' ? '/app/home-client' : '/app/home-doctor'" 
       routerLinkActive="text-indigo-600" 
       [routerLinkActiveOptions]="{exact: true}" 
       class="flex flex-col items-center justify-center w-full pt-4 pb-3 text-gray-500 hover:text-indigo-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-xs mt-1" i18n="@@navigation.home">Home</span>
    </a>

    <!-- Search Link -->
    <a routerLink="/app/search" 
       routerLinkActive="text-indigo-600"
       class="flex flex-col items-center justify-center w-full pt-4 pb-3 text-gray-500 hover:text-indigo-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <span class="text-xs mt-1" i18n="@@navigation.search">Search</span>
    </a>
    
    <!-- Profile Link -->
    <a routerLink="/app/profile" 
       routerLinkActive="text-indigo-600" 
       class="flex flex-col items-center justify-center w-full pt-4 pb-3 text-gray-500 hover:text-indigo-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-xs mt-1" i18n="@@navigation.profile">Profile</span>
    </a>
  </div>
</nav>
