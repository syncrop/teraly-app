<div class="pb-32 bg-gray-50 min-h-screen">
  <!-- Header -->
  <div class="bg-white px-6 py-6 sticky top-0 z-10">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-sm text-gray-600" i18n="@@clientHome.greeting">Buenos días,</p>
        <h1 class="text-2xl font-bold text-gray-900">{{ userName }}</h1>
      </div>
      <button class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
    </div>
  </div>

  <!-- Mood Section Component -->
  <app-moods></app-moods>

  <!-- Stats Section -->
  <div class="px-6 grid grid-cols-2 gap-4 mb-6">
    <!-- Streak Card -->
    <div class="bg-orange-50 rounded-2xl p-4 border border-orange-100">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-2xl">🔥</span>
        <span class="text-orange-600 text-sm font-semibold" i18n="@@clientHome.streak">Racha</span>
      </div>
      <p class="text-2xl font-bold text-gray-900">
        3 <span class="text-sm text-gray-600" i18n="@@clientHome.days">Días</span>
      </p>
    </div>

    <!-- Sessions Card -->
    <div class="bg-green-50 rounded-2xl p-4 border border-green-100">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-2xl">📈</span>
        <span class="text-green-600 text-sm font-semibold" i18n="@@clientHome.sessions"
          >Sesiones</span
        >
      </div>
      <p class="text-2xl font-bold text-gray-900">2/10</p>
    </div>
  </div>

  <!-- Next Appointment Card -->
  <div class="px-6">
    <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-semibold" i18n="@@clientHome.nextAppointment"
          >PRÓXIMA CONSULTA</span
        >
        <button
          class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center hover:bg-indigo-400"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M13 10H3L13 3v7zm0 0h10L13 17v-7z" />
          </svg>
        </button>
      </div>

      <div class="mb-4">
        <p class="text-4xl font-bold">16:30</p>
        <p class="text-indigo-200 text-sm" i18n="@@clientHome.appointmentDate">
          Hoy, 24 de Octubre
        </p>
      </div>

      <div class="flex items-center gap-3 mb-6">
        <img
          src="https://via.placeholder.com/48"
          alt="Doctor"
          class="w-12 h-12 rounded-full border-2 border-indigo-400"
        />
        <div>
          <p class="font-semibold">Dr. Javier Perez</p>
          <p class="text-indigo-200 text-sm" i18n="@@clientHome.doctorSpecialty">
            Psicología Clínica • Online
          </p>
        </div>
      </div>

      <button
        class="w-full bg-white text-indigo-600 font-semibold py-3 rounded-lg hover:bg-gray-100 transition-colors"
        i18n="@@clientHome.joinNow"
      >
        Unirse ahora →
      </button>
    </div>
  </div>
</div>
