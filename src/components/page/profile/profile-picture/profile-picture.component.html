<div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
  <div class="flex flex-col items-center">
    <!-- Profile Picture -->
    <div class="relative mb-4">
      @if (profileImage()) {
        <!-- Image with loading state -->
        <div class="relative">
          <img 
            [src]="profileImage()!" 
            alt="Profile picture" 
            class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg"
            [class.opacity-50]="isLoading()"
          />
          @if (isLoading()) {
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            </div>
          }
        </div>
      } @else {
        <!-- Default avatar with initials -->
        <div class="w-32 h-32 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center border-4 border-white shadow-lg">
          <span class="text-white text-4xl font-bold">{{ getInitials() }}</span>
        </div>
      }

      <!-- Camera button -->
      <button 
        (click)="triggerFileInput()"
        class="absolute bottom-0 right-0 w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        [disabled]="isLoading()">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>

      <!-- Hidden file input -->
      <input 
        type="file" 
        id="fileInput" 
        accept="image/*" 
        class="hidden" 
        (change)="onFileSelected($event)"
      />
    </div>

    <!-- User Name -->
    <h2 class="text-2xl font-bold text-gray-900 mb-1">{{ userName() }}</h2>
    
    <!-- User Role Badge -->
    <span class="px-4 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium mb-4" i18n="@@profile.userRole">
      {{ userRole() }}
    </span>

    <!-- Action Buttons -->
    @if (profileImage()) {
      <div class="flex gap-3 w-full max-w-xs">
        <button 
          (click)="triggerFileInput()"
          class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          [disabled]="isLoading()"
          i18n="@@profile.changePhoto">
          Cambiar foto
        </button>
        <button 
          (click)="removeProfilePicture()"
          class="flex-1 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
          [disabled]="isLoading()"
          i18n="@@profile.removePhoto">
          Eliminar
        </button>
      </div>
    }
  </div>
</div>
