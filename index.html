
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teraly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      position: fixed;
      overflow: hidden;
      /* Color de las safe areas superior e inferior */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Opcional: diferentes colores para top y bottom */
    @supports (padding-top: env(safe-area-inset-top)) {
      html {
        /* Gradiente para safe areas con colores distintos */
        background: linear-gradient(
          to bottom,
          #ffffff 0%,
          #ffffff env(safe-area-inset-top),
          #f9fafb env(safe-area-inset-top),
          #f9fafb calc(100% - env(safe-area-inset-bottom)),
          #ffffff calc(100% - env(safe-area-inset-bottom)),
          #ffffff 100%
        );
      }
    }

    #root-container {
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      background-color: #ffffff;
      padding-bottom: 0;
      position: relative;
      z-index: 1;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://aistudiocdn.com/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://aistudiocdn.com/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://aistudiocdn.com/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://aistudiocdn.com/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://aistudiocdn.com/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://aistudiocdn.com/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/compiler": "https://next.esm.sh/@angular/compiler@^21.0.3?external=rxjs",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^21.0.3?external=rxjs",
    "@angular/router": "https://next.esm.sh/@angular/router@^21.0.3?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^21.0.3?external=rxjs",
    "@angular/forms": "https://next.esm.sh/@angular/forms@^21.0.3?external=rxjs",
    "@angular/core/rxjs-interop": "https://next.esm.sh/@angular/core@^21.0.3/rxjs-interop?external=rxjs",
    "@angular/common": "https://next.esm.sh/@angular/common@^21.0.3?external=rxjs",
    "@angular/common/http": "https://next.esm.sh/@angular/common@^21.0.3/http?external=rxjs",
    "@angular/localize": "https://next.esm.sh/@angular/localize@^21.0.3",
    "@angular/localize/init": "https://next.esm.sh/@angular/localize@^21.0.3/init"
  }
}
</script>
</head>
<body>
  <div id="root-container">
    <app-root></app-root>
  </div>
</body>
</html>
